# TEMPLATE (A-003): nightly dump of the real studio database. Disabled until the owner adds the secrets
# PROD_DB_URL, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY (and optionally BACKUP_S3_ENDPOINT),
# and changes `if: false` to `if: true`. See docs/launch/3-backup-restore.md. Nothing here runs on its own.
name: nightly-backup
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
jobs:
  dump:
    if: false # the owner switches this on once the secrets exist
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump the whole database (public and auth)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          pg_dump --format=custom --no-owner --schema=public --schema=auth --file "reform-$(date -u +%F).dump" "$PROD_DB_URL"
          ls -l reform-*.dump
      - name: List the media bucket (files are re-uploadable from the studio's photo originals)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: psql "$PROD_DB_URL" -At -c "select name from storage.objects where bucket_id = 'media'" > "media-$(date -u +%F).txt"
      - name: Upload to the studio's own storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          pip install --quiet awscli
          EXTRA=""; [ -n "$ENDPOINT" ] && EXTRA="--endpoint-url $ENDPOINT"
          aws s3 cp $EXTRA reform-*.dump "s3://$BUCKET/db/"
          aws s3 cp $EXTRA media-*.txt "s3://$BUCKET/media/"
